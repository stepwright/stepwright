name: clang-tidy

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy + build tooling
        run: bash scripts/install_toolchain.sh build tidy

      - name: Configure (export compile_commands.json)
        env:
          CC: clang-22
          CXX: clang++-22
        run: |
          cmake -S . -B build/tidy \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DSTEPWRIGHT_BUILD_BENCHMARKS=OFF \
              -DFETCHCONTENT_QUIET=ON

      # stepwright is header-only: headers are analysed through the translation
      # units that include them (tests and examples).
      - name: Run clang-tidy
        run: |
          run-clang-tidy -p build/tidy -quiet \
              -header-filter='.*/include/stepwright/.*\.hpp$' \
              $(find tests examples -name '*.cpp' 2>/dev/null)
