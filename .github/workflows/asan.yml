name: asan

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: bash scripts/install_toolchain.sh build sanitizers

      - name: Build + run with ASan
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: make asan CMAKE_FLAGS="-DFETCHCONTENT_QUIET=ON"

      - name: Upload sanitizer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asan-logs
          path: build/asan/Testing/
          retention-days: 7
