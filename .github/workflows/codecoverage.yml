name: codecoverage

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: lcov HTML coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lcov + gcc + cmake
        run: bash scripts/install_toolchain.sh build coverage

      - name: Generate coverage (scripts/coverage.py)
        env:
          CC: gcc
          CXX: g++
        # scripts/coverage.py defaults to NOT opening a browser, which is
        # what we want in CI. Pass --clean for a hermetic build dir.
        run: make coverage COVERAGE_ARGS="--clean"

      - name: Upload HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/coverage_html/
          retention-days: 14

      # Optional Codecov upload. Step is skipped on forks (where the secret is
      # unavailable) so PRs from contributors do not fail.
      - name: Upload to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage/coverage.info
          fail_ci_if_error: false
