name: clang-format

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-22
        run: |
          # Remove any existing clang-format to avoid conflicts
          sudo apt-get remove -y clang-format || true
          
          # Add LLVM repository
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main"
          sudo apt-get update
          
          # Install clang-format-22
          sudo apt-get install -y clang-format-22
          
          # Make it the default
          sudo ln -sf /usr/bin/clang-format-22 /usr/bin/clang-format

      - name: Verify clang-format version
        run: clang-format --version

      - name: Run format check
        run: bash scripts/format-code.sh --check
