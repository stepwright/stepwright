name: cppcheck

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck + cmake
        run: bash scripts/install_toolchain.sh build cppcheck

      - name: Configure (export compile_commands.json)
        run: |
          cmake -S . -B build/default \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DSTEPWRIGHT_BUILD_BENCHMARKS=OFF \
              -DFETCHCONTENT_QUIET=ON

      - name: Run cppcheck (project scan)
        run: bash scripts/run-cppcheck.sh -b build/default

      - name: Upload cppcheck reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-reports
          path: build/default/cppcheck/reports/
          retention-days: 7
