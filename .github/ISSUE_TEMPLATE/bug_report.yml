name: Bug report
description: Report a reproducible correctness, build or documentation problem
body:
  - type: markdown
    attributes:
      value: "For exploitable defects, use the private reporting instructions in SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Commit/version, OS, architecture, compiler/version, standard library, build flags and tracking setting
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A self-contained program and the exact build/run command; include a virtual-executor seed if applicable
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include relevant output, sanitizer diagnostics and frequency, without secrets
    validations:
      required: true
